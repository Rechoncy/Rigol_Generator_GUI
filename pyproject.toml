[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rigol-generator-gui"
version = "0.7.25"
description = "Portable DG4000, SIGLENT SSG, Vaunix, Newport and NI DAQ control center"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7",
]

[project.optional-dependencies]
instrument = [
    "pyserial>=3.5",
    "PyVISA>=1.14",
    "nidaqmx>=1.0",
]

[project.scripts]
rigol-generator-gui = "rigol_control.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rigol_control = ["assets/*.svg", "assets/*.png", "assets/*.ico", "assets/*.ps1"]
